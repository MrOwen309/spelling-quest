<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelling Quest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spelling Quest">
<meta name="theme-color" content="#8fd8ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one centered play column; each screen is a single card on a sunny sky. Single bright theme by choice. */
:root{
  --sky:#8fd8ff; --sky2:#d6f2ff; --card:#ffffff; --ink:#24324a; --muted:#5c6b85;
  --coral:#ff6b4a; --coral-d:#d94a2b; --gold:#ffc23d; --gold-d:#d99a00;
  --mint:#2fc58a; --mint-d:#1e9a69; --grape:#7a5cff; --line:#e3ecf7; --bad:#ff4d6d;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky),var(--sky2) 70%);background-color:var(--sky);color:var(--ink);font-family:var(--body);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.card{background:var(--card);border-radius:28px;padding:24px;box-shadow:0 6px 0 rgba(36,50,74,.12)}
.big{font-family:var(--display);font-weight:800;font-size:1.5rem;padding:14px 28px;border-radius:20px;color:#fff;background:var(--coral);box-shadow:0 6px 0 var(--coral-d);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--coral-d)}
.big.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-d)}
.big.grape{background:var(--grape);box-shadow:0 6px 0 #5a3fd6}
.big small{display:block;font-family:var(--body);font-size:.85rem;font-weight:700;opacity:.9}
.tabs{display:flex;gap:6px;background:var(--sky2);padding:5px;border-radius:16px}
.tab{flex:1;padding:10px;border-radius:12px;font-weight:700;background:transparent;color:var(--muted)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 rgba(36,50,74,.1)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:110px;padding-top:6px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;min-width:0}
.bar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--line);min-height:4px}
.bar i.on{background:linear-gradient(180deg,var(--grape),#a993ff)}
.bar span{font-size:.7rem;color:var(--muted)}
.bar.today span{color:var(--ink);font-weight:700}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line);flex-wrap:wrap}
.wrow:last-child{border-bottom:0}
.wrow b{font-family:var(--display);font-size:1.3rem}
.wrow .sub{font-size:.9rem;color:var(--muted);flex-basis:100%;margin-top:-4px}
.chip{padding:4px 10px;border-radius:10px;font-size:.85rem;font-weight:700;white-space:nowrap}
.chip.good{background:#d7f5e8;color:#16774f}.chip.ok{background:#fff1cc;color:#7a5600}
.chip.bad{background:#ffe0e6;color:#b0223f}.chip.new{background:var(--sky2);color:var(--muted)}
.typo{font-family:var(--display);color:var(--bad);font-weight:600}
.ghost{background:transparent;color:var(--muted);font-weight:700;padding:10px 14px;border-radius:14px;font-size:1rem}
.ghost:hover{background:rgba(255,255,255,.5)}

/* top bar */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 rgba(36,50,74,.1);font-variant-numeric:tabular-nums}
.gem{width:22px;height:22px;display:inline-block}
.spacer{flex:1}
.xpbar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}

/* home */
.hero{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.hero h1{font-size:clamp(2.6rem,9vw,4rem);color:var(--coral);letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted)}
.mascot{font-size:4.5rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:var(--sky2);border-radius:18px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.slot{aspect-ratio:1;border-radius:14px;background:var(--sky2);display:grid;place-items:center;font-size:1.9rem}
.slot.locked{font-size:1.1rem;color:#b5c3d8;font-family:var(--display);font-weight:800}
.slot.rare{background:#fff4d6;box-shadow:inset 0 0 0 3px var(--gold)}
.slot.epic{background:#efe9ff;box-shadow:inset 0 0 0 3px var(--grape)}

/* play */
.dots{display:flex;gap:8px;justify-content:center}
.dot{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.7)}
.dot.now{background:var(--gold);transform:scale(1.25)}
.dot.ok{background:var(--mint)}
.dot.miss{background:var(--coral)}
.mode{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grape);text-align:center}
.prompt{text-align:center;font-family:var(--display);font-size:1.5rem}
.speak{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spk{background:var(--sky2);border-radius:18px;padding:12px 18px;font-weight:700;display:flex;gap:8px;align-items:center}
.spk:active{transform:scale(.96)}
.combo{text-align:center;font-family:var(--display);font-weight:800;color:var(--coral);min-height:1.6em;font-size:1.25rem}
input,textarea{-webkit-user-select:text;user-select:text}
.answer{width:100%;font-family:var(--display);font-size:2.2rem;text-align:center;padding:10px;border-radius:20px;border:4px solid var(--line);color:var(--ink);background:#fbfdff;letter-spacing:.06em}
.answer:focus{border-color:var(--grape);outline:none}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:64px}
.box{min-width:46px;height:58px;border-radius:14px;border:3px dashed #c4d3e6;display:grid;place-items:center;font-family:var(--display);font-size:2rem;font-weight:800;padding:0 6px}
.box.fixed{border:0;background:transparent}
.box.filled{border:3px solid var(--grape);background:#f2eeff;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{width:58px;height:62px;border-radius:16px;background:var(--gold);box-shadow:0 5px 0 var(--gold-d);font-family:var(--display);font-size:2rem;font-weight:800;color:var(--ink)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-d)}
.tile.used{visibility:hidden}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.msg{text-align:center;font-weight:700;min-height:1.5em;margin:0;color:var(--muted)}
.msg.bad{color:var(--bad)}
.reveal{text-align:center;font-family:var(--display);font-size:3rem;color:var(--grape);letter-spacing:.08em}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.float{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:3rem;color:var(--gold);-webkit-text-stroke:2px var(--ink);pointer-events:none;z-index:20;animation:up 1.1s ease-out forwards;white-space:nowrap}
@keyframes up{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}

/* reward */
.chest{font-size:7rem;line-height:1;background:none;animation:wiggle 1s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.prize{font-size:7rem;line-height:1}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;background:var(--sky2)}
.tag.rare{background:var(--gold)} .tag.epic{background:var(--grape);color:#fff}

/* parent */
label{font-weight:700;display:block;margin-bottom:6px}
textarea,.field{width:100%;font:inherit;font-size:1rem;padding:12px;border-radius:14px;border:3px solid var(--line);background:#fbfdff;color:var(--ink)}
textarea{min-height:240px;resize:vertical}
.note{font-size:.9rem;color:var(--muted);margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:14px}
.tricky{display:flex;flex-wrap:wrap;gap:6px}
.tricky span{background:#ffe6e0;border-radius:10px;padding:4px 10px;font-size:.95rem}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.tile{width:50px;height:56px;font-size:1.7rem}.box{min-width:38px;height:50px;font-size:1.6rem}.card{padding:18px}}
</style>
</head>
<body>

<script>
(() => {
const DEFAULT_WORDS = `# Spelling Quest word list

## THIS WEEK

## THIS YEAR

## SHOULD KNOW
# Common words a 3rd grader should already spell. Used in Big Review.

you're | You're a great speller!
`;

const STICKERS = [
 ["🐶","common"],["🐱","common"],["🐸","common"],["🐢","common"],["🐠","common"],["🐝","common"],["🦋","common"],["🐞","common"],
 ["🍩","common"],["🍕","common"],["🍓","common"],["🌮","common"],["🧁","common"],["🍉","common"],["⚽","common"],["🎈","common"],
 ["🐼","rare"],["🦊","rare"],["🐙","rare"],["🦜","rare"],["🐬","rare"],["🦒","rare"],["🌈","rare"],["🚀","rare"],["🎸","rare"],["🍦","rare"],
 ["🦄","epic"],["🐉","epic"],["👑","epic"],["💎","epic"],["🦖","epic"],["🌟","epic"]
];
const PRAISE = ["Awesome!","You got it!","Spelling star!","Nailed it!","Super!","Wow!","Brain power!","Amazing!","Perfect!","Yes!!"];
const ROUND = 5;
const SAVE_KEY = "spellingQuest.v1";

// ---------- state ----------
let S = load() || {gems:0,xp:0,stickers:[],streak:0,lastDay:null,words:DEFAULT_WORDS,miss:{},rounds:0,bestCombo:0,sound:true};
S.ws=S.ws||{};S.log=S.log||{};
function load(){try{return JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

function parseWords(text){
  let sec="core";const out=[];
  String(text||"").split("\n").forEach(raw=>{
    const l=raw.trim(); if(!l) return;
    const h=l.match(/^##\s*(.*)$/);
    if(h){const k=h[1].toLowerCase();sec=k.includes("week")?"week":k.includes("year")?"year":"core";return}
    if(l.startsWith("#")) return;
    const [w,...rest]=l.split("|");
    const word=w.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z'-]/g,"");
    if(word.length<2) return;
    out.push({w:word,s:rest.join("|").trim(),sec});
  });
  return out;
}
function poolFor(kind){
  const all=wordList();
  if(kind==="week") return all.filter(x=>x.sec==="week");
  const seen=new Set();return all.filter(x=>!seen.has(x.w)&&seen.add(x.w));
}
const wordList = () => parseWords(S.words);
const level = () => Math.floor(S.xp/100)+1;
const xpPct = () => S.xp%100;

// ---------- audio ----------
let actx;
function tone(freqs,dur=.12,type="triangle",gap=.08){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type;o.frequency.value=f;
      const st=t0+i*gap;
      g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.25,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+dur);
      o.connect(g).connect(actx.destination);o.start(st);o.stop(st+dur+.05);
    });
  }catch(e){}
}
const sfx = {
  ok:()=>tone([523,659,784,1047]),
  big:()=>tone([523,659,784,1047,1319,1568],.16,"triangle",.07),
  bad:()=>tone([300,220],.18,"sawtooth",.12),
  tap:()=>tone([880],.05,"sine"),
  chest:()=>tone([392,523,659,784,988,1175,1568],.2,"square",.09)
};
let voice=null;
function pickVoice(){
  try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
    voice=vs.find(v=>/samantha|google us|natural|aria|jenny/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs[0]||null;}catch(e){}
}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(text,rate=.8){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=rate;u.pitch=1.05;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}
}

// ---------- confetti ----------
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],raf=null;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",resize);resize();
function confetti(n=80){
  if(reduce) return;
  const cols=["#ff6b4a","#ffc23d","#2fc58a","#7a5cff","#8fd8ff","#ff4d9d"];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:120});
  if(!raf) loop();
}
function loop(){
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}
function floatText(t){const d=document.createElement("div");d.className="float";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const GEM='<svg class="gem" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#7a5cff"/><path d="M2 9h20L12 21z" fill="#5a3fd6"/><path d="M6 3l3 6 3-6 3 6 3-6" fill="none" stroke="#c9bcff" stroke-width="1.4"/></svg>';
function hud(){
  return `<div class="hud">
    <div class="pill">${GEM}<span id="gems">${S.gems}</span></div>
    <div class="pill" title="Days in a row">🔥 ${S.streak}</div>
    <div class="pill">⭐ Lv ${level()}</div>
    <div class="spacer"></div>
    <button class="ghost" id="snd" aria-label="Sound on or off">${S.sound?"🔊":"🔇"}</button>
  </div>`;
}
function bindHud(){const b=$("#snd");if(b)b.onclick=()=>{S.sound=!S.sound;save();b.textContent=S.sound?"🔊":"🔇"}}
function todayStr(d=new Date()){return d.toISOString().slice(0,10)}

// ---------- HOME ----------
function home(){
  const owned=new Set(S.stickers);
  const wk=poolFor("week");
  const tricky=Object.entries(S.miss).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([w])=>w);
  app.innerHTML = hud()+`
  <div class="card hero">
    <div class="mascot" aria-hidden="true">🦉</div>
    <h1>Spelling Quest</h1>
    <p>Spell ${ROUND} words. Win gems. Open the treasure chest!</p>
    <div style="width:100%"><div class="xpbar" aria-label="Level progress"><i style="width:${xpPct()}%"></i></div>
      <p class="note" style="text-align:center">${100-xpPct()} XP to level ${level()+1}</p></div>
    <div class="row">
      ${wk.length?`<button class="big" id="playWeek">▶ This Week<small>${wk.length} school words</small></button>`:""}
      <button class="big grape" id="playAll">🌎 Big Review<small>${poolFor("all").length} words</small></button>
    </div>
    ${wk.length?"":`<p class="note">No words for this week yet. Ask a grown-up to add them!</p>`}
    <div class="stats">
      <div class="stat"><b>${S.stickers.length}/${STICKERS.length}</b><span>Stickers</span></div>
      <div class="stat"><b>${S.rounds}</b><span>Quests</span></div>
      <div class="stat"><b>x${S.bestCombo}</b><span>Best combo</span></div>
    </div>
  </div>
  <div class="card stack">
    <h2 style="font-size:1.6rem">My sticker book</h2>
    <div class="album">${STICKERS.map(([e,r])=>owned.has(e)?`<div class="slot ${r}">${e}</div>`:`<div class="slot locked">?</div>`).join("")}</div>
    ${tricky.length?`<div><p class="note" style="margin-bottom:6px">Words to practice (they show up more often):</p><div class="tricky">${tricky.map(w=>`<span>${esc(w)}</span>`).join("")}</div></div>`:""}
  </div>
  <div class="row"><button class="ghost" id="grown">⚙︎ Grown-ups: progress &amp; words</button></div>`;
  bindHud();
  if($("#playWeek")) $("#playWeek").onclick=()=>{sfx.tap();startRound("week")};
  $("#playAll").onclick=()=>{sfx.tap();startRound("all")};

}

// ---------- ROUND ----------
let R;
function pickWords(list){
  if(!list.length) return [];
  const pool=list.map(x=>({...x,wt:(x.sec==="core"?1:2)+(S.miss[x.w]||0)*3}));
  const out=[];
  while(out.length<Math.min(ROUND,list.length)){
    const tot=pool.reduce((a,b)=>a+b.wt,0);let r=Math.random()*tot;
    const i=pool.findIndex(p=>(r-=p.wt)<0);out.push(pool.splice(i<0?0:i,1)[0]);
  }
  return out;
}
function startRound(kind="all"){
  const words=pickWords(poolFor(kind));
  if(!words.length){home();return}
  const modes=shuffle(["listen","listen","scramble","missing","listen"]);
  R={kind,words,modes,i:0,results:[],combo:0,earned:0,xp:0};
  turn();
}
function turn(){
  const W=R.words[R.i], mode=R.modes[R.i%R.modes.length];
  R.cur={W,mode,tries:0};
  const labels={listen:"🎧 Listen & spell",scramble:"🔀 Unscramble",missing:"🧩 Missing letters"};
  app.innerHTML = hud()+`
  <div class="dots">${R.words.map((_,k)=>`<div class="dot ${k<R.i?(R.results[k]?"ok":"miss"):k===R.i?"now":""}"></div>`).join("")}</div>
  <div class="card stack" id="play-card">
    <div class="mode">${labels[mode]}</div>
    <div class="speak">
      <button class="spk" id="hear">🔊 Hear word</button>
      ${W.s?`<button class="spk" id="hearS">💬 Hear sentence</button>`:""}
      <button class="spk" id="slow">🐢 Slow</button>
    </div>
    <div id="area" class="stack"></div>
    <div class="msg" id="msg"></div>
    <div class="combo" id="combo">${R.combo>=2?`🔥 ${R.combo} in a row!`:""}</div>
  </div>
  <div class="row"><button class="ghost" id="quit">← Back home</button></div>`;
  bindHud();
  $("#hear").onclick=()=>say(W.w);
  $("#slow").onclick=()=>say(W.w,.5);
  if(W.s) $("#hearS").onclick=()=>say(W.s);
  $("#quit").onclick=home;
  ({listen:modeListen,scramble:modeScramble,missing:modeMissing})[mode]();
  setTimeout(()=>say(W.s?`${W.w}. ${W.s}. ${W.w}.`:W.w),250);
}

function inputHTML(id="ans"){return `<input id="${id}" class="answer" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" enterkeyhint="done" aria-label="Type the word">`}

function modeListen(){
  $("#area").innerHTML=`<div class="prompt">Type the word you hear</div>${inputHTML()}<div class="row"><button class="big mint" id="check">Check ✓</button></div>`;
  const inp=$("#ans");inp.focus();
  const go=()=>{const v=inp.value.trim().toLowerCase().replace(/[’‘]/g,"'");if(!v)return;judge(v===R.cur.W.w,()=>{inp.value="";inp.focus()},v)};
  $("#check").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
}

function tileBoard(letters,slotsSpec,onFull){
  // slotsSpec: array of {fixed:char} or {blank:true}
  const placed=[];
  const area=$("#area");
  area.innerHTML=`<div class="slots" id="slots"></div><div class="tiles" id="tiles">${letters.map((l,k)=>`<button class="tile" data-k="${k}">${l}</button>`).join("")}</div>
    <div class="row"><button class="ghost" id="clear">↺ Start over</button></div>`;
  const blanks=slotsSpec.map((s,i)=>s.blank?i:-1).filter(i=>i>=0);
  function draw(){
    let b=0;
    $("#slots").innerHTML=slotsSpec.map((s,i)=>{
      if(!s.blank) return `<div class="box fixed">${s.fixed}</div>`;
      const p=placed[b++];return p?`<div class="box filled" data-b="${b-1}">${letters[p.k]}</div>`:`<div class="box"></div>`;
    }).join("");
    document.querySelectorAll(".box.filled").forEach(el=>el.onclick=()=>{const idx=+el.dataset.b;const p=placed.splice(idx,1)[0];document.querySelector(`.tile[data-k="${p.k}"]`).classList.remove("used");sfx.tap();draw()});
  }
  document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
    if(placed.length>=blanks.length)return;
    sfx.tap();t.classList.add("used");placed.push({k:+t.dataset.k});draw();
    if(placed.length===blanks.length){
      let b=0;const word=slotsSpec.map(s=>s.blank?letters[placed[b++].k]:s.fixed).join("");
      setTimeout(()=>onFull(word,reset),200);
    }
  });
  function reset(){placed.length=0;document.querySelectorAll(".tile").forEach(t=>t.classList.remove("used"));draw()}
  $("#clear").onclick=reset;
  draw();
}

function modeScramble(){
  const w=R.cur.W.w;let letters=shuffle(w.split(""));
  if(letters.join("")===w&&w.length>2) letters=shuffle(letters);
  tileBoard(letters,w.split("").map(()=>({blank:true})),(word,reset)=>judge(word===w,reset,word));
  $("#area").insertAdjacentHTML("afterbegin",`<div class="prompt">Tap the letters in order</div>`);
}

function modeMissing(){
  const w=R.cur.W.w;const chars=w.split("");
  const vowelIdx=chars.map((c,i)=>/[aeiouy]/.test(c)?i:-1).filter(i=>i>=0);
  const nBlank=w.length<=4?1:w.length<=7?2:3;
  let idx=shuffle(vowelIdx).slice(0,nBlank);
  if(idx.length<nBlank) idx=idx.concat(shuffle(chars.map((_,i)=>i).filter(i=>!idx.includes(i))).slice(0,nBlank-idx.length));
  idx.sort((a,b)=>a-b);
  const need=idx.map(i=>chars[i]);
  const extras=shuffle("aeioulrstnhcgk".split("").filter(c=>!need.includes(c))).slice(0,6-need.length+1);
  const letters=shuffle(need.concat(extras));
  tileBoard(letters,chars.map((c,i)=>idx.includes(i)?{blank:true}:{fixed:c}),(word,reset)=>judge(word===w,reset,word));
  $("#area").insertAdjacentHTML("afterbegin",`<div class="prompt">Fill in the missing letters</div>`);
}

// ---------- progress tracking ----------
function wsOf(w){return S.ws[w]=S.ws[w]||{n:0,f:0,s:0,m:0,h:"",errs:[],last:null}}
function track(w,res){ // res: F = right first try, S = right on second try, M = missed
  const x=wsOf(w);x.n++;if(res==="F")x.f++;else if(res==="S")x.s++;else x.m++;
  x.h=(x.h+res).slice(-8);x.last=todayStr();
  const d=todayStr();const L=S.log[d]=S.log[d]||{w:0,f:0,q:0};L.w++;if(res==="F")L.f++;
  const keys=Object.keys(S.log).sort();while(keys.length>90)delete S.log[keys.shift()];
}
function trackErr(w,typed,mode){
  if(mode!=="listen"||!typed)return;
  const x=wsOf(w);x.errs.push(typed);x.errs=x.errs.slice(-6);
}
function judge(ok,retry,typed){
  const W=R.cur.W;
  if(ok){
    R.combo++;S.bestCombo=Math.max(S.bestCombo,R.combo);
    const mult=R.combo>=5?3:R.combo>=3?2:1;
    const base=R.cur.tries===0?10:5;
    const g=base*mult;
    R.earned+=g;R.xp+=R.cur.tries===0?20:10;S.gems+=g;
    if(R.cur.tries===0&&S.miss[W.w]) S.miss[W.w]=Math.max(0,S.miss[W.w]-1);
    track(W.w,R.cur.tries===0?"F":"S");R.results[R.i]=true;save();
    (mult>1?sfx.big:sfx.ok)();confetti(mult>1?140:70);
    floatText(`+${g}${mult>1?` (x${mult}!)`:""}`);
    const card=$("#play-card");card.classList.remove("pop");void card.offsetWidth;card.classList.add("pop");
    $("#msg").className="msg";$("#msg").textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    $("#combo").textContent=R.combo>=2?`🔥 ${R.combo} in a row!`:"";
    $("#gems").textContent=S.gems;
    say(W.w+"! "+$("#msg").textContent,1);
    lockArea();setTimeout(next,1300);
    return;
  }
  R.cur.tries++;sfx.bad();trackErr(W.w,typed,R.cur.mode);
  const card=$("#play-card");card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");
  if(R.cur.tries===1){
    $("#msg").className="msg bad";
    $("#msg").textContent=`So close! Try again. It has ${W.w.length} letters and starts with “${W.w[0]}”.`;
    retry();return;
  }
  // second miss: reveal and copy
  R.combo=0;S.miss[W.w]=(S.miss[W.w]||0)+1;track(W.w,"M");R.results[R.i]=false;save();
  $("#combo").textContent="";
  $("#msg").className="msg";$("#msg").textContent="Let's learn this one. Look closely, then type it!";
  $("#area").innerHTML=`<div class="reveal pop">${esc(W.w)}</div>${inputHTML("copy")}<div class="row"><button class="big grape" id="cp">Done ✓</button></div>`;
  say(W.w+". "+W.w.split("").join(", ")+". "+W.w,.7);
  const inp=$("#copy");inp.focus();
  const go=()=>{if(inp.value.trim().toLowerCase().replace(/[’‘]/g,"'")===W.w){S.gems+=2;R.earned+=2;R.xp+=5;save();sfx.ok();floatText("+2");lockArea();setTimeout(next,900)}else{inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake")}};
  $("#cp").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
}
function lockArea(){document.querySelectorAll("#area button,#area input").forEach(e=>e.disabled=true)}
function next(){R.i++;if(R.i>=R.words.length)reward();else turn()}

// ---------- REWARD ----------
function reward(){
  const right=R.results.filter(Boolean).length;
  const perfect=right===R.words.length;
  const bonus=perfect?25:0;S.gems+=bonus;R.earned+=bonus;
  const lvBefore=level();S.xp+=R.xp;const lvUp=level()>lvBefore;
  S.rounds++;
  {const d=todayStr();const L=S.log[d]=S.log[d]||{w:0,f:0,q:0};L.q++;}
  const t=todayStr(),y=todayStr(new Date(Date.now()-864e5));
  if(S.lastDay!==t){S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=t}
  // sticker roll: better odds when perfect
  const roll=Math.random(),epicP=perfect?.18:.08,rareP=perfect?.45:.3;
  const tier=roll<epicP?"epic":roll<epicP+rareP?"rare":"common";
  const tierList=STICKERS.filter(s=>s[1]===tier);
  const fresh=tierList.filter(s=>!S.stickers.includes(s[0]));
  const anyFresh=STICKERS.filter(s=>!S.stickers.includes(s[0]));
  const pick=(fresh.length?fresh:anyFresh.length?anyFresh:tierList)[Math.floor(Math.random()*(fresh.length||anyFresh.length||tierList.length))];
  const isNew=!S.stickers.includes(pick[0]);if(isNew)S.stickers.push(pick[0]);
  save();
  app.innerHTML=hud()+`
  <div class="card hero" id="rw">
    <h1 style="font-size:2.6rem">${perfect?"PERFECT QUEST!":"Quest complete!"}</h1>
    <p>You spelled <b>${right} of ${R.words.length}</b> words on your own.</p>
    <div class="stats">
      <div class="stat"><b>+${R.earned}</b><span>Gems</span></div>
      <div class="stat"><b>+${R.xp}</b><span>XP</span></div>
      <div class="stat"><b>🔥${S.streak}</b><span>Day streak</span></div>
    </div>
    ${perfect?`<p class="tag rare">+25 perfect bonus</p>`:""}
    ${lvUp?`<p class="tag epic">Level up! You're level ${level()}</p>`:""}
    <p style="font-family:var(--display);font-size:1.4rem;margin-top:6px">Tap the chest!</p>
    <button class="chest" id="chest" aria-label="Open treasure chest">🎁</button>
  </div>`;
  bindHud();
  confetti(perfect?200:100);(perfect?sfx.big:sfx.ok)();
  $("#chest").onclick=()=>{
    sfx.chest();confetti(220);setTimeout(()=>confetti(160),350);
    $("#chest").outerHTML=`<div class="prize pop">${pick[0]}</div>
      <p><span class="tag ${pick[1]}">${pick[1]}</span> ${isNew?"New sticker!":"You already had this one. Bonus +5 gems!"}</p>
      <div class="row"><button class="big" id="again">Play again!</button><button class="big grape" id="hm">My stickers</button></div>`;
    if(!isNew){S.gems+=5;save();$("#gems").textContent=S.gems}
    say(isNew?"You got a new sticker!":"Bonus gems!",1);
    $("#again").onclick=()=>{sfx.tap();startRound(R.kind)};
    $("#hm").onclick=home;
  };
}

// ---------- GROWN-UPS ----------
function gate(){
  const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4);
  app.innerHTML=`<div class="card stack">
    <h2>Grown-ups only</h2><p class="note">Answer to continue: what is ${a} × ${b}?</p>
    <input id="g" class="field" inputmode="numeric" autocomplete="off" aria-label="Answer">
    <div class="row"><button class="big mint" id="gok">Continue</button><button class="ghost" id="gx">Cancel</button></div>
    <p class="msg bad" id="gm"></p></div>`;
  const go=()=>{if(+$("#g").value===a*b)parent();else $("#gm").textContent="Not quite. Try again."};
  $("#gok").onclick=go;$("#g").onkeydown=e=>{if(e.key==="Enter")go()};$("#gx").onclick=home;$("#g").focus();
}
function parent(tab="progress"){
  app.innerHTML=`<div class="card stack">
    <div class="tabs" role="tablist"><button class="tab ${tab==="progress"?"on":""}" id="tP">Progress</button><button class="tab ${tab==="words"?"on":""}" id="tW">Word list</button></div>
    <div id="pbody" class="stack"></div>
    <div class="row"><button class="big" id="bk">← Back to game</button></div>
  </div>`;
  $("#tP").onclick=()=>parent("progress");$("#tW").onclick=()=>parent("words");$("#bk").onclick=home;
  (tab==="progress"?progressView:wordsView)($("#pbody"));
}

function wordStatus(w){
  const x=S.ws[w];
  if(!x||!x.n) return ["new","Not tried"];
  if(x.h.length>=3&&x.h.slice(-3)==="FFF") return ["good","Mastered"];
  if(x.h.slice(-1)==="F") return ["ok","Getting there"];
  return ["bad","Needs practice"];
}
function wordDetail(w){
  const x=S.ws[w];if(!x||!x.n) return "";
  const typos=[...new Set(x.errs)].slice(-4);
  return `Right first try ${x.f} of ${x.n}${typos.length?` · she wrote: ${typos.map(t=>`<span class="typo">${esc(t)}</span>`).join(", ")}`:""}`;
}
function troubleWords(){
  return Object.entries(S.ws).filter(([,x])=>x.n&&x.n>x.f)
    .sort((a,b)=>((b[1].n-b[1].f)/b[1].n-(a[1].n-a[1].f)/a[1].n)||(b[1].n-b[1].f)-(a[1].n-a[1].f)).slice(0,10).map(([w])=>w);
}
function progressView(el){
  const list=wordList();
  const days=[...Array(14)].map((_,i)=>todayStr(new Date(Date.now()-(13-i)*864e5)));
  const active=days.filter(d=>(S.log[d]||{}).w).length;
  const all=Object.values(S.ws);const n=all.reduce((a,x)=>a+x.n,0),f=all.reduce((a,x)=>a+x.f,0);
  const maxW=Math.max(5,...days.map(d=>(S.log[d]||{}).w||0));
  const week=list.filter(x=>x.sec==="week");
  const year=[...new Set(list.filter(x=>x.sec==="year").map(x=>x.w))];
  const yc={good:0,ok:0,bad:0,new:0};year.forEach(w=>yc[wordStatus(w)[0]]++);
  const trouble=troubleWords();
  const row=w=>{const [k,t]=wordStatus(w);const d=wordDetail(w);return `<div class="wrow"><b>${esc(w)}</b><span class="chip ${k}">${t}</span>${d?`<div class="sub">${d}</div>`:""}</div>`};
  el.innerHTML=`
    ${n?"":`<p class="note" style="margin:0">Nothing recorded yet. Progress shows up here after she plays.</p>`}
    <div class="kpis">
      <div class="stat"><b>${active} of 14</b><span>Days practiced</span></div>
      <div class="stat"><b>${n?Math.round(f/n*100)+"%":"–"}</b><span>Right first try</span></div>
      <div class="stat"><b>${n}</b><span>Words spelled</span></div>
      <div class="stat"><b>${S.rounds}</b><span>Quests</span></div>
    </div>
    <div><h3 style="font-size:1.2rem">Last 2 weeks</h3>
      <div class="bars" aria-label="Words practiced per day, last 14 days">${days.map((d,i)=>{const w=(S.log[d]||{}).w||0;
        const dn=new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"narrow"});
        return `<div class="bar ${i===13?"today":""}" title="${d}: ${w} words"><i class="${w?"on":""}" style="height:${w?Math.max(8,w/maxW*100):4}%"></i><span>${dn}</span></div>`}).join("")}</div>
      <p class="note">Words practiced each day.</p></div>
    <div><h3 style="font-size:1.2rem">This week's words</h3>
      ${week.length?`<div>${[...new Set(week.map(x=>x.w))].map(row).join("")}</div>`:`<p class="note" style="margin:0">No words in the This Week section yet.</p>`}
      <p class="note">Mastered means right on the first try 3 times in a row.</p></div>
    ${year.length?`<div><h3 style="font-size:1.2rem">This year's words</h3><p class="note" style="margin:0">${yc.good} mastered · ${yc.ok} getting there · ${yc.bad} need practice · ${yc.new} not tried yet</p></div>`:""}
    <div><h3 style="font-size:1.2rem">Trickiest words</h3>
      ${trouble.length?`<div>${trouble.map(row).join("")}</div><p class="note">Misspellings are what she typed in Listen &amp; Spell rounds. These words come up more often in her games.</p>`:`<p class="note" style="margin:0">No trouble words yet.</p>`}</div>
    <div class="row"><button class="big mint" id="cpy">Copy report</button></div>
    <p class="msg" id="cm" style="min-height:0"></p>
    <textarea id="rep" hidden readonly style="min-height:160px"></textarea>
    <p class="note" style="margin:0">Progress is saved on this device only. Copy the report to text or email it to yourself, her teacher, or Claude.</p>
    <div class="row" id="rz"><button class="ghost" id="rs">Reset all progress…</button></div>`;
  $("#cpy").onclick=()=>{
    const lines=[`Spelling Quest report, ${new Date().toLocaleDateString()}`,
      `Practiced ${active} of the last 14 days. ${n} words spelled, ${n?Math.round(f/n*100):0}% right on the first try. ${S.rounds} quests total.`];
    if(week.length){lines.push("","This week:");[...new Set(week.map(x=>x.w))].forEach(w=>{const x=S.ws[w];lines.push(`- ${w}: ${wordStatus(w)[1]}${x&&x.n?` (${x.f}/${x.n} first try${x.errs.length?`; wrote ${[...new Set(x.errs)].slice(-4).join(", ")}`:""})`:""}`)})}
    if(year.length) lines.push("",`This year's words: ${yc.good} mastered, ${yc.ok} getting there, ${yc.bad} need practice, ${yc.new} not tried.`);
    if(trouble.length){lines.push("","Trickiest words:");trouble.forEach(w=>{const x=S.ws[w];lines.push(`- ${w}: ${x.f}/${x.n} first try${x.errs.length?`; wrote ${[...new Set(x.errs)].slice(-4).join(", ")}`:""}`)})}
    const text=lines.join("\n");const ta=$("#rep");ta.value=text;
    const fallback=()=>{ta.hidden=false;ta.focus();ta.select();$("#cm").textContent="Select all and copy the text below."};
    try{navigator.clipboard.writeText(text).then(()=>{$("#cm").textContent="Copied! Paste it into a text or email."},fallback)}catch(e){fallback()}
  };
  $("#rs").onclick=()=>{$("#rz").innerHTML=`<span class="note">Erase gems, stickers, streak and progress?</span><button class="ghost" id="ry" style="color:var(--bad)">Yes, reset</button><button class="ghost" id="rn">Keep</button>`;
    $("#ry").onclick=()=>{const w=S.words;S={gems:0,xp:0,stickers:[],streak:0,lastDay:null,words:w,miss:{},rounds:0,bestCombo:0,sound:S.sound,ws:{},log:{}};save();parent()};
    $("#rn").onclick=()=>parent();};
}

function wordsView(el){
  const list=wordList();
  el.innerHTML=`
    <p class="note" style="margin:0">These words come from <b>words.txt</b> in your GitHub repo. To change them from any phone or computer, open that file on github.com, tap the pencil icon, edit, and commit. The game picks up the new list the next time it opens. GitHub can take a minute or two to publish a change.</p>
    ${[["week","This week"],["year","This year"],["core","Should know"]].map(([k,nm])=>{const ws=list.filter(x=>x.sec===k);
      return `<div><h3 style="font-size:1.2rem">${nm} <span class="note">(${ws.length})</span></h3>${ws.length?`<div class="tricky">${ws.map(x=>`<span style="background:var(--sky2)">${esc(x.w)}</span>`).join("")}</div>`:`<p class="note" style="margin:0">None yet.</p>`}</div>`}).join("")}
    <p class="note" style="margin:0">Each game picks ${ROUND} words. Big Review uses every section and picks school words more often than should-know words. Words she misses come back more often in both.</p>
    <div class="row"><button class="big mint" id="rf">Check for new words</button></div>
    <p class="msg" id="sm"></p>`;
  $("#rf").onclick=async()=>{const m=$("#sm");m.className="msg";m.textContent="Checking…";
    const r=await syncWords();
    if(r==="new"){m.textContent="Got the new list!";setTimeout(()=>parent("words"),800)}
    else if(r==="same") m.textContent="Already up to date.";
    else {m.className="msg bad";m.textContent="Couldn't reach GitHub. Using the saved list for now."}};
}

// ---------- word list from GitHub (words.txt next to this page) ----------
async function syncWords(){
  try{
    const res=await fetch("words.txt?t="+Date.now(),{cache:"no-store"});
    if(!res.ok) return "fail";
    const t=await res.text();
    if(!parseWords(t).length) return "fail";
    if(t===S.words) return "same";
    S.words=t;
    const keep=new Set(parseWords(t).map(x=>x.w));
    for(const k in S.miss) if(!keep.has(k)) delete S.miss[k];
    save(); return "new";
  }catch(e){return "fail"}
}
function syncAndRefresh(){syncWords().then(r=>{if(r==="new"&&document.getElementById("playAll"))home()})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncAndRefresh()});
if("serviceWorker" in navigator){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}

home();
syncAndRefresh();
})();
</script>
